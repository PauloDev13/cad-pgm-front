# Este arquivo sera o seu default.conf dentro do container
server {
    listen 8080;
    server_name localhost;

    # Aumenta o limite de upload para evitar o erro 413 do Nginx
    client_max_body_size 20M;

    # ======================================================================
    # BACKEND JAVA (Spring Boot) — servico Docker 'backend'
    # ======================================================================
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }

    # ======================================================================
    # BACKEND PYTHON (FastAPI) — roda no Win11 host (host.docker.internal:8000)
    # ======================================================================
    location /python-api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $python_host host.docker.internal;
        proxy_pass http://$python_host:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # SSE: desabilitar buffering para streaming em tempo real
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;

        # Manter cookies (ponto_session) entre browser e backend Python
        proxy_cookie_flags ~ SameSite=Lax;
    }

    # ======================================================================
    # FRONTEND (Arquivos Estaticos do Angular)
    # ======================================================================
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Suporte para rotas do Angular (F5 nao da 404)
        try_files $uri $uri/ /index.html;
    }

    # Tratamento amigavel de erros de servidor (opcional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
